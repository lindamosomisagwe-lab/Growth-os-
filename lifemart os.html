<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Gravity — Private Space for Long Distance Couples</title>

    <!-- React app bundling module script -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js for premium circular charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>





    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'paper': '#FFFFFF',         // Cozy card paper background
                        'beige': '#FAF8F5',         // Layout background
                        'blush': '#D4537E',         // Muted Blush toggles and buttons
                        'clay': '#7F77DD',          // Clay Taupe accents, borders and charts
                        'charcoal': '#2F2E2C',      // Typography and high-contrast structural text

                        // Purple Theme Extensions
                        'sidebar-bg': '#1a1033',
                        'gradient-start': '#7F77DD',
                        'gradient-end': '#D4537E',
                        'accent-purple': '#7F77DD',

                        // Legacy utility aliases for zero-break compatibility
                        'sunflower': '#D4537E',
                        'tech-blue': '#7F77DD',
                        'partner-blue': '#1a1033'
                    },
                    fontFamily: { 'nunito': ['Nunito', 'sans-serif'] },
                    boxShadow: {
                        'brutal': '6px 6px 0px 0px #7F77DD',
                        'brutal-sm': '3px 3px 0px 0px #7F77DD',
                        'brutal-active': '1px 1px 0px 0px #7F77DD',
                    },
                    borderWidth: { '3': '3px' }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF8F5;
            color: #2F2E2C;
            margin: 0;
            overflow-x: hidden;
        }

        .dot-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(127, 119, 221, 0.15) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            z-index: -1;
            pointer-events: none;
        }

        .brutal-btn {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .brutal-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px 0px #7F77DD;
        }

        .notebook-textarea {
            background-color: transparent;
            background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(127, 119, 221, 0.2) 32px);
            line-height: 32px;
            padding-top: 6px;
            border: none;
            resize: vertical;
            outline: none;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            color: #2F2E2C;
            width: 100%;
        }

        textarea.notebook-textarea {
            min-height: 150px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #D4537E;
            cursor: pointer;
            border: 3px solid #7F77DD;
            margin-top: -8px;
            box-shadow: 2px 2px 0px 0px #7F77DD;
        }

        input[type=range].partner-slider::-webkit-slider-thumb {
            background: #FFFFFF;
            border-color: #1a1033;
            box-shadow: 2px 2px 0px 0px #1a1033;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: rgba(127, 119, 221, 0.1);
            border-radius: 3px;
            border: 1px solid #7F77DD;
        }

        .monoline-checkbox {
            width: 24px;
            height: 24px;
            border: 3px solid #7F77DD;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #FFFFFF;
            transition: all 0.1s ease-in-out;
            box-shadow: 2px 2px 0px 0px #7F77DD;
        }

        .monoline-checkbox.checked {
            background: #D4537E;
            box-shadow: 1px 1px 0px 0px #7F77DD;
            transform: translate(1px, 1px);
        }

        .monoline-checkbox.checked::after {
            content: "X";
            color: #FFFFFF;
            font-weight: 900;
            font-size: 16px;
            line-height: 1;
        }

        .polaroid {
            background: #FFFFFF;
            padding: 12px 12px 40px 12px;
            border: 3px solid #7F77DD;
            box-shadow: 6px 6px 0px 0px #7F77DD;
            transform: rotate(calc(-3deg + 6deg * var(--rand)));
            transition: transform 0.2s;
            cursor: pointer;
        }

        .polaroid:hover {
            transform: scale(1.05) rotate(0deg);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 3px solid #7F77DD;
        }

        @keyframes flyAirplane {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }

            50% {
                transform: translate(150px, -100px) rotate(15deg) scale(1.2);
                opacity: 1;
            }

            100% {
                transform: translate(300px, -200px) rotate(30deg) scale(0.5);
                opacity: 0;
            }
        }

        .fly-animation {
            animation: flyAirplane 1.5s ease-out forwards;
        }

        @keyframes sweatDrop {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }

            50% {
                transform: translateY(10px) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(20px) scale(0.5);
                opacity: 0;
            }
        }

        .sweat-animation {
            animation: sweatDrop 1s ease-in forwards;
        }

        @keyframes burstStar {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }

            50% {
                transform: scale(1.5) rotate(45deg);
                opacity: 1;
            }

            100% {
                transform: scale(2) rotate(90deg);
                opacity: 0;
            }
        }

        .burst-animation {
            animation: burstStar 0.5s ease-out forwards;
        }

        @keyframes shootConfetti {
            0% {
                transform: translateY(0) scale(1) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(720deg);
                opacity: 0;
            }
        }

        .confetti-particle {
            animation: shootConfetti 1.2s ease-out forwards;
        }
    </style>
</head>

<body>
    <div class="dot-grid"></div>
    <div id="root"></div>
</body>

</html>
